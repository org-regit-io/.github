  <text x="902" y="242" fill="#b9bbc7" font-family="Inter, system-ui, sans-serif" font-size="15">Result with its evidence</text>
  <text x="902" y="266" fill="#b9bbc7" font-family="Inter, system-ui, sans-serif" font-size="15">attached</text>

  <text x="50" y="337" fill="#b9bbc7" font-family="Inter, system-ui, sans-serif" font-size="15">The source revision, rule path and decision stay connected to the result.</text>
</svg>
